name: Temporary RVC model transfer

on:
  push:
    branches: [main]
    paths-ignore:
      - ready.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-model:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Alanite RVC model files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p model
          curl --fail --location --retry 4 --retry-delay 5 \
            --output model/alanite.pth \
            'https://huggingface.co/kronosta/DimensionalStack-RVC/resolve/main/alanite.pth?download=true'
          curl --fail --location --retry 4 --retry-delay 5 \
            --output model/alanite.index \
            'https://huggingface.co/kronosta/DimensionalStack-RVC/resolve/main/added_IVF235_Flat_nprobe_1_alanite_v2.index?download=true'
          sha256sum model/alanite.pth model/alanite.index > model/SHA256SUMS.txt
          printf '%s\n' \
            'Model: Alanite RVC' \
            'Source: https://huggingface.co/kronosta/DimensionalStack-RVC' \
            'License declared by source repository: MIT' \
            > model/SOURCE_AND_LICENSE.txt
          test -s model/alanite.pth
          test -s model/alanite.index
          ls -lh model

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alanite-RVC-model
          path: model
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish workflow run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '{"run_id":%s,"artifact_name":"Alanite-RVC-model","commit":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > ready.json
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD
          cp "$GITHUB_WORKSPACE/ready.json" ready.json
          git add ready.json
          git commit -m 'Publish temporary RVC artifact run ID [skip ci]'
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
